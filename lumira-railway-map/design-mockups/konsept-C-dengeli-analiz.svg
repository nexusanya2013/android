    <linearGradient id="dist3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0a4a66"/><stop offset=".5" stop-color="#2b8cbe"/><stop offset="1" stop-color="#9fe0ff"/></linearGradient>
