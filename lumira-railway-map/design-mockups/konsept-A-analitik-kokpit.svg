  <!-- callouts -->
  <g font-size="11" fill="#2bb673">
    <text x="20" y="80" font-weight="700">▲ SAMPLE TEXT yerine gerçek KPI kartları</text>
    <text x="1200" y="78" font-weight="700">▲ Yeni: seçili kesim detay paneli + mini grafikler</text>
