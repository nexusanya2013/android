        <rect x="70" y="8" width="170" height="14" rx="3" fill="#6fd0ff"/><text x="246" y="20" class="val">145</text>
        <rect x="70" y="26" width="206" height="14" rx="3" fill="#2f6e92"/><text x="282" y="38" class="val">176</text>
        <text x="0" y="64" class="lbl">Yük</text>
        <rect x="70" y="52" width="300" height="14" rx="3" fill="#6fd0ff" opacity=".8"/><text x="376" y="64" class="val">306</text>
        <rect x="70" y="70" width="290" height="14" rx="3" fill="#2f6e92"/><text x="366" y="82" class="val">295</text>
      </g>
    </g>

    <!-- speed comparison -->
    <g transform="translate(16,266)">
      <text x="0" y="0" class="h">Ortalama Hız (km/sa)</text>
      <g transform="translate(0,14)">
        <rect width="358" height="72" rx="6" fill="#102a3f" stroke="#1d3e58"/>
        <text x="16" y="28" class="lbl">Yolcu Gidiş</text><text x="120" y="28" class="acc" font-size="13" font-weight="700">69</text>
        <text x="200" y="28" class="lbl">Dönüş</text><text x="270" y="28" class="acc" font-size="13" font-weight="700">56</text>
        <text x="16" y="56" class="lbl">Yük Gidiş</text><text x="120" y="56" fill="#ffb454" font-size="13" font-weight="700">32</text>
        <text x="200" y="56" class="lbl">Dönüş</text><text x="270" y="56" fill="#ffb454" font-size="13" font-weight="700">34</text>
      </g>
    </g>

    <!-- mini route profile -->
    <g transform="translate(16,366)">
      <text x="0" y="0" class="h">Komşu Kesimler (Doğançay hattı)</text>
      <g transform="translate(0,14)" font-size="12">
        <rect width="358" height="120" rx="6" fill="#102a3f" stroke="#1d3e58"/>
        <g fill="#cfe3f2">
          <text x="14" y="26">1512-1540 · Arifiye–Doğançay</text><text x="330" y="26" text-anchor="end" class="acc">64</text>
          <text x="14" y="50">1540-1712 · Doğançay–YHT Bilecik</text><text x="330" y="50" text-anchor="end" class="acc">194</text>
          <text x="14" y="74">1540-2435 · Doğançay–Eskişehir</text><text x="330" y="74" text-anchor="end" fill="#6fd0ff" font-weight="700">69</text>
          <text x="14" y="98">1615-1540 · Sapanca–Doğançay</text><text x="330" y="98" text-anchor="end" class="acc">70</text>
        </g>
      </g>
    </g>
  </g>

  <!-- BOTTOM TABLE -->
  <g transform="translate(16,616)">
    <rect width="1568" height="276" rx="8" fill="url(#card)" stroke="#1d3e58" filter="url(#sh)"/>
