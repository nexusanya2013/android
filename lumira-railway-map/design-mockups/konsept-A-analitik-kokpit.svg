    <text x="16" y="26" fill="#eaf3fa" font-size="14" font-weight="700">Hat Kesimi Detayları</text>
    <rect x="1180" y="12" width="220" height="24" rx="12" fill="#0e2336" stroke="#27506e"/><text x="1196" y="28" class="lbl">🔍 Ara: istasyon / kod…</text>
    <rect x="1410" y="12" width="64" height="24" rx="6" fill="#15334b" stroke="#27506e"/><text x="1442" y="28" text-anchor="middle" class="val">Sütunlar</text>
    <rect x="1482" y="12" width="70" height="24" rx="6" class="acc"/><text x="1517" y="28" text-anchor="middle" fill="#06202e" font-size="11" font-weight="700">⤓ CSV</text>
    <!-- grouped header -->
    <g transform="translate(0,44)">
      <rect width="1568" height="46" fill="#13314a"/>
      <line x1="0" y1="46" x2="1568" y2="46" stroke="#27506e"/>
      <g fill="#9fb6c9" font-size="11">
        <text x="14" y="28">Kod</text>
        <text x="120" y="28">1. İstasyon</text>
        <text x="300" y="28">2. İstasyon</text>
        <text x="470" y="28">Mesafe (km)</text>
        <!-- grouped: Süre -->
        <text x="600" y="16" fill="#7fb7d6">PLAN SÜRE (dk)</text>
        <text x="600" y="38">Yolcu G</text><text x="680" y="38">Yolcu D</text><text x="760" y="38">Yük G</text><text x="840" y="38">Yük D</text>
        <!-- grouped: Hız -->
        <text x="940" y="16" fill="#7fb7d6">ORT. HIZ (km/sa)</text>
        <text x="940" y="38">Yolcu G</text><text x="1030" y="38">Yolcu D</text><text x="1120" y="38">Yük G</text><text x="1210" y="38">Yük D</text>
        <text x="1320" y="28">Trend</text>
      </g>
      <line x1="585" y1="6" x2="585" y2="40" stroke="#27506e"/><line x1="925" y1="6" x2="925" y2="40" stroke="#27506e"/><line x1="1300" y1="6" x2="1300" y2="40" stroke="#27506e"/>
    </g>
    <!-- rows with conditional formatting -->
    <g transform="translate(0,90)" font-size="12">
      <!-- row -->
      <g><rect width="1568" height="34" fill="#0f2435"/>
        <text x="14" y="22" fill="#cfe3f2">1540-2435</text><text x="120" y="22" fill="#cfe3f2">Doğançay</text><text x="300" y="22" fill="#cfe3f2">Eskişehir</text>
        <text x="470" y="22" fill="#eaf3fa">165.694</text>
        <text x="600" y="22" fill="#cfe3f2">145</text><text x="680" y="22" fill="#cfe3f2">176</text><text x="760" y="22" fill="#cfe3f2">306</text><text x="840" y="22" fill="#cfe3f2">295</text>
        <text x="940" y="22" fill="#6fd0ff">69</text><text x="1030" y="22" fill="#6fd0ff">56</text>
        <rect x="1112" y="8" width="34" height="18" rx="4" fill="#7a3b3b"/><text x="1118" y="22" fill="#ffd2d2">32</text>
        <rect x="1202" y="8" width="34" height="18" rx="4" fill="#7a3b3b"/><text x="1208" y="22" fill="#ffd2d2">34</text>
        <polyline points="1320,24 1336,18 1352,22 1368,12 1384,16" fill="none" stroke="#6fd0ff" stroke-width="1.5"/>
      </g>
      <g transform="translate(0,34)"><rect width="1568" height="34" fill="#0c1e2e"/>
        <text x="14" y="22" fill="#cfe3f2">1540-1712</text><text x="120" y="22" fill="#cfe3f2">Doğançay</text><text x="300" y="22" fill="#cfe3f2">YHT Bilecik</text>
        <text x="470" y="22" fill="#eaf3fa">73.267</text>
        <text x="600" y="22" fill="#cfe3f2">23</text><text x="680" y="22" fill="#cfe3f2">22</text><text x="760" y="22" fill="#7f93a5">—</text><text x="840" y="22" fill="#7f93a5">—</text>
        <text x="940" y="22" fill="#6fd0ff">194</text><text x="1030" y="22" fill="#6fd0ff">196</text>
        <rect x="1112" y="8" width="44" height="18" rx="4" fill="#5a4a2a"/><text x="1118" y="22" fill="#ffe6b0">DIF0</text>
        <rect x="1202" y="8" width="44" height="18" rx="4" fill="#5a4a2a"/><text x="1208" y="22" fill="#ffe6b0">DIF0</text>
        <polyline points="1320,20 1336,22 1352,14 1368,18 1384,10" fill="none" stroke="#6fd0ff" stroke-width="1.5"/>
      </g>
      <g transform="translate(0,68)"><rect width="1568" height="34" fill="#0f2435"/>
        <text x="14" y="22" fill="#cfe3f2">1615-1512</text><text x="120" y="22" fill="#cfe3f2">Sapanca</text><text x="300" y="22" fill="#cfe3f2">Arifiye</text>
        <text x="470" y="22" fill="#eaf3fa">7.791</text>
        <text x="600" y="22" fill="#cfe3f2">6</text><text x="680" y="22" fill="#cfe3f2">6</text><text x="760" y="22" fill="#cfe3f2">10</text><text x="840" y="22" fill="#cfe3f2">22</text>
        <text x="940" y="22" fill="#6fd0ff">75</text><text x="1030" y="22" fill="#6fd0ff">73</text>
        <rect x="1112" y="8" width="34" height="18" rx="4" fill="#2e5a3a"/><text x="1118" y="22" fill="#bff0c8">45</text>
        <rect x="1202" y="8" width="34" height="18" rx="4" fill="#2e5a3a"/><text x="1208" y="22" fill="#bff0c8">45</text>
        <polyline points="1320,22 1336,16 1352,18 1368,14 1384,12" fill="none" stroke="#6fd0ff" stroke-width="1.5"/>
      </g>
