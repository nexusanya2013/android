  <!-- RIGHT DETAIL PANEL -->
  <g transform="translate(1196,84)">
    <rect width="388" height="520" rx="8" fill="url(#card)" stroke="#1d3e58" filter="url(#sh)"/>
    <rect width="388" height="40" rx="8" fill="#15334b"/>
    <text x="16" y="26" fill="#eaf3fa" font-size="14" font-weight="700">Seçili Hat Kesimi · 1540-2435</text>
    <text x="16" y="64" class="lbl">Doğançay → Eskişehir · Sıra 31</text>
    <rect x="372" y="6" width="10" height="28"/>
    <rect x="354" y="10" width="22" height="20" rx="10" class="new"/><text x="365" y="24" text-anchor="middle" fill="#06202e" font-size="9" font-weight="700">Yeni</text>

    <!-- detail KPIs -->
    <g transform="translate(16,80)">
      <rect width="174" height="56" rx="6" fill="#102a3f" stroke="#1d3e58"/><text x="12" y="22" class="h">Planlanan Mesafe</text><text x="12" y="44" fill="#eaf3fa" font-size="18" font-weight="700">165.694 km</text>
      <rect x="184" width="174" height="56" rx="6" fill="#102a3f" stroke="#1d3e58"/><text x="196" y="22" class="h">Yolcu Ort. Hız</text><text x="196" y="44" fill="#eaf3fa" font-size="18" font-weight="700">69 / 56</text>
