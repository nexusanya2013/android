<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1f31"/><stop offset="1" stop-color="#081522"/>
    </linearGradient>
    <linearGradient id="dist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a4a66"/><stop offset=".5" stop-color="#2b8cbe"/><stop offset="1" stop-color="#9fe0ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#143049"/><stop offset="1" stop-color="#102537"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity=".35"/></filter>
    <clipPath id="mapClip"><rect x="312" y="84" width="872" height="520" rx="8"/></clipPath>
    <style>
      .h{fill:#7fb7d6;font-size:11px;letter-spacing:.6px;text-transform:uppercase}
      .kpi{fill:#eaf3fa;font-size:30px;font-weight:700}
      .unit{fill:#88a6bd;font-size:12px}
      .lbl{fill:#9fb6c9;font-size:12px}
      .val{fill:#dfeaf3;font-size:12px}
      .title{fill:#eef6fc;font-size:22px;font-weight:700;letter-spacing:1px}
      .badge{fill:#1f6f9c}
      .acc{fill:#37a3d6}
      .grid{stroke:#21425c;stroke-width:1}
      .ln{fill:none;stroke:#2f6e92;stroke-width:1.6;opacity:.8}
      .lnHi{fill:none;stroke:#6fd0ff;stroke-width:4;filter:drop-shadow(0 0 4px #6fd0ff)}
      .chip{fill:#15334b;stroke:#27506e}
      .new{fill:#2bb673}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- top bar -->
  <rect width="1600" height="64" fill="#0a1c2c"/>
  <circle cx="34" cy="32" r="17" fill="none" stroke="#7fb7d6" stroke-width="2"/><text x="34" y="37" text-anchor="middle" fill="#7fb7d6" font-size="11" font-weight="700">TCDD</text>
  <text x="800" y="40" text-anchor="middle" class="title">KAPASİTE PLAN DETAYI — ANALİTİK KOKPİT</text>
  <!-- filter chips right -->
  <g>
    <rect class="chip" x="1140" y="18" width="100" height="28" rx="14"/><text x="1190" y="36" text-anchor="middle" class="val">PLANMESAFE ▾</text>
    <rect class="chip" x="1248" y="18" width="60" height="28" rx="14"/><text x="1278" y="36" text-anchor="middle" class="val">Ay ▾</text>
    <rect class="chip" x="1316" y="18" width="74" height="28" rx="14"/><text x="1353" y="36" text-anchor="middle" class="val">2026 ▾</text>
    <rect class="chip" x="1398" y="18" width="84" height="28" rx="14"/><text x="1440" y="36" text-anchor="middle" class="val">GRUP2 ▾</text>
    <rect class="acc" x="1492" y="18" width="92" height="28" rx="6"/><text x="1538" y="36" text-anchor="middle" fill="#06202e" font-size="12" font-weight="700">⤓ Dışa Aktar</text>
  </g>
  <text x="16" y="58" class="lbl">Son güncelleme: 09.06.2026 10:42 · Filtre: GRUP2 / 2026 / Ay</text>

  <!-- LEFT KPI RAIL -->
  <g>
    <!-- 5 KPI cards -->
    <!-- card template repeated -->
    <g transform="translate(16,84)">
      <rect width="284" height="92" rx="8" fill="url(#card)" stroke="#1d3e58" filter="url(#sh)"/>
      <text x="16" y="26" class="h">Toplam Planlanan Mesafe</text>
      <text x="16" y="62" class="kpi">12.480 <tspan class="unit">km</tspan></text>
      <polyline points="180,70 196,58 212,64 228,46 244,52 260,38" class="lnHi" stroke-width="2"/>
    </g>
    <g transform="translate(16,184)">
      <rect width="284" height="92" rx="8" fill="url(#card)" stroke="#1d3e58" filter="url(#sh)"/>
      <text x="16" y="26" class="h">Toplam Sefer / Hat Kesimi</text>
      <text x="16" y="62" class="kpi">978 <tspan class="unit">hat kesimi</tspan></text>
    </g>
    <g transform="translate(16,284)">
      <rect width="284" height="92" rx="8" fill="url(#card)" stroke="#1d3e58" filter="url(#sh)"/>
      <text x="16" y="26" class="h">Ort. Hız (Gidiş / Dönüş)</text>
      <text x="16" y="62" class="kpi">78 <tspan class="unit">/ 74 km/sa</tspan></text>
    </g>
    <g transform="translate(16,384)">
      <rect width="284" height="92" rx="8" fill="url(#card)" stroke="#1d3e58" filter="url(#sh)"/>
      <text x="16" y="26" class="h">Toplam Plan Süre</text>
      <text x="16" y="62" class="kpi">1.842 <tspan class="unit">saat</tspan></text>
    </g>
    <!-- donut card: Yolcu / Yük -->
    <g transform="translate(16,484)">
      <rect width="284" height="120" rx="8" fill="url(#card)" stroke="#1d3e58" filter="url(#sh)"/>
      <text x="16" y="26" class="h">Yolcu / Yük Dağılımı</text>
      <circle cx="74" cy="76" r="32" fill="none" stroke="#27506e" stroke-width="14"/>
      <circle cx="74" cy="76" r="32" fill="none" stroke="#6fd0ff" stroke-width="14" stroke-dasharray="126 201" transform="rotate(-90 74 76)"/>
      <text x="74" y="80" text-anchor="middle" fill="#eaf3fa" font-size="14" font-weight="700">63%</text>
      <rect x="140" y="56" width="12" height="12" rx="2" fill="#6fd0ff"/><text x="158" y="66" class="val">Yolcu 63%</text>
      <rect x="140" y="82" width="12" height="12" rx="2" fill="#2f6e92"/><text x="158" y="92" class="val">Yük 37%</text>
    </g>
  </g>

  <!-- MAP -->
  <rect x="312" y="84" width="872" height="520" rx="8" fill="#0a1622" stroke="#1d3e58"/>
  <g clip-path="url(#mapClip)">
    <rect x="312" y="84" width="872" height="520" fill="#0b1a26"/>
    <!-- faint province grid -->
    <g class="grid" opacity=".25">
      <path d="M312 200 H1184 M312 320 H1184 M312 440 H1184 M450 84 V604 M620 84 V604 M800 84 V604 M980 84 V604"/>
    </g>
    <!-- railway-ish network -->
    <path class="ln" d="M360 360 C480 330 560 300 700 320 S900 360 1040 300"/>
    <path class="ln" d="M420 480 C540 470 640 420 760 430 S980 470 1120 420"/>
    <path class="ln" d="M700 320 C720 360 740 420 760 430"/>
    <path class="ln" d="M1040 300 C1060 360 1080 440 1120 420"/>
    <path class="ln" d="M520 180 C600 240 660 300 700 320"/>
    <path class="ln" d="M980 200 C1000 250 1020 280 1040 300"/>
    <path class="ln" d="M460 300 C500 320 520 340 540 470" opacity=".5"/>
    <!-- highlighted selected route Doğançay-Eskişehir -->
    <path class="lnHi" d="M560 300 C640 300 690 320 700 380 S760 470 840 470"/>
    <circle cx="560" cy="300" r="5" fill="#6fd0ff"/><circle cx="840" cy="470" r="5" fill="#6fd0ff"/>
  </g>
  <!-- map toolbar -->
  <g transform="translate(326,98)">
    <rect width="26" height="78" rx="5" fill="#0e2336" stroke="#27506e"/>
    <text x="13" y="20" text-anchor="middle" fill="#cfe3f2" font-size="16">+</text>
    <text x="13" y="44" text-anchor="middle" fill="#cfe3f2" font-size="16">−</text>
    <text x="13" y="68" text-anchor="middle" fill="#cfe3f2" font-size="12">⤢</text>
  </g>
  <!-- legend -->
  <g transform="translate(330,540)">
    <rect width="220" height="50" rx="6" fill="#0e2336cc" stroke="#27506e"/>
    <text x="12" y="20" class="lbl">Planlanan Mesafe (km)</text>
    <rect x="12" y="28" width="196" height="10" rx="3" fill="url(#dist)"/>
    <text x="12" y="49" class="lbl" font-size="9">0</text><text x="196" y="49" class="lbl" font-size="9">450k</text>
