<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Crosstab Grid - Ayarlar</title>
<style>
  html,body{margin:0;padding:0;font-family:"Segoe UI",Arial,sans-serif;font-size:12px;color:#243240;background:#f4f7fa}
  #tcxaps{padding:8px 10px}
  .aps-sec{margin:6px 0 10px;border:1px solid #dfe6ec;border-radius:6px;background:#fff}
  .aps-sec>h4{margin:0;padding:7px 10px;font-size:12px;background:#eef3f7;border-bottom:1px solid #dfe6ec;cursor:pointer;user-select:none;display:flex;justify-content:space-between}
  .aps-bd{padding:8px 10px}
  .aps-row{display:flex;align-items:center;gap:6px;margin:5px 0}
  .aps-row label.lbl{flex:1;min-width:0;color:#3a4a59}
  .aps-row input[type=text],.aps-row input[type=number],.aps-row select{flex:0 0 130px;max-width:130px;border:1px solid #cfd8e0;border-radius:4px;padding:3px 5px;font-size:12px;background:#fff}
  .aps-citem{display:flex;align-items:center;gap:6px;margin:3px 0}
  .aps-h{font-weight:700;margin:8px 0 3px;color:#1f5577}
  .aps-mrow{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid #eef2f6}
  .aps-mname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .aps-mrow select{flex:0 0 64px;border:1px solid #cfd8e0;border-radius:4px;font-size:11px}
  .aps-tag{color:#5a6b7b;font-size:10px}
  .aps-note{color:#7a8a99;font-style:italic;padding:6px 2px}
  .aps-bd.collapsed{display:none}
</style>
<script type="text/javascript" src="aps.js"></script>
</head>
<body>
  <div id="tcxaps"></div>
</body>
</html>
